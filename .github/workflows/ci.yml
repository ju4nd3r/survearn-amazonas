name: CI/CD — Lint, Validate Content, Test, Build & Docker

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality-and-unit-tests:
    name: Validate Content, Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate ethnobotanical content & i18n parity
        run: npm run validate:content

      - name: TypeScript strict typecheck
        run: npm run typecheck

      - name: ESLint code quality check
        run: npm run lint

      - name: Run Vitest unit test suite
        run: npm run test:unit

      - name: Build production PWA bundle
        run: npm run build

  e2e-playwright:
    name: Playwright E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: quality-and-unit-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Run Playwright E2E smoke test
        run: npm run test:e2e

  docker-build-and-healthcheck:
    name: Build & Verify Multi-Stage Docker Image
    runs-on: ubuntu-latest
    needs: quality-and-unit-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production Docker image
        run: docker build --target prod -t survearn-amazonas:ci .

      - name: Start container and verify /healthz endpoint
        run: |
          docker run -d --name survearn-test -p 8080:8080 survearn-amazonas:ci
          sleep 3
          curl --fail http://127.0.0.1:8080/healthz
          docker rm -f survearn-test
