services:
  # Default production service (`docker compose up` or `docker compose --profile prod up`)
  survearn-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: survearn-amazonas:latest
    container_name: survearn-amazonas-prod
    ports:
      - "8080:8080"
    restart: unless-stopped
    profiles:
      - ""
      - prod
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Hot-reload development service (`docker compose --profile dev up`)
  survearn-dev:
    image: node:22-alpine
    container_name: survearn-amazonas-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    profiles:
      - dev
